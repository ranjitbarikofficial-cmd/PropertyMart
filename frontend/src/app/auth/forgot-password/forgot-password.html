
<main class="auth-page">
  <div class="auth-page__backdrop" aria-hidden="true"></div>

  <section class="auth-card" aria-labelledby="forgot-heading">
    <a routerLink="/" class="brand">
      <span class="brand__mark" aria-hidden="true"></span>
      <span class="brand__text">Property<strong>Mart</strong></span>
    </a>

    <div class="icon-badge" aria-hidden="true">
      <span class="icon-badge__envelope">
        <span class="icon-badge__flap"></span>
      </span>
    </div>

    <h1 id="forgot-heading" class="auth-card__title">
      Forgot your password?
    </h1>

    <p class="auth-card__subtitle">
      Enter your registered email address and choose a new password
      for your PropertyMart account.
    </p>

    <form class="auth-form" (ngSubmit)="resetPassword()" #forgotForm="ngForm" novalidate>

      <div class="field">
        <label for="email">Email address</label>
        <input
          id="email"
          name="email"
          type="email"
          placeholder="you@example.com"
          autocomplete="email"
          [(ngModel)]="email"
          required
          email
        />
      </div>

      <div class="field">
        <label for="newPassword">New Password</label>
        <input
          id="newPassword"
          name="newPassword"
          type="password"
          placeholder="Enter new password"
          autocomplete="new-password"
          [(ngModel)]="newPassword"
          required
          minlength="6"
        />
      </div>

      <div class="field">
        <label for="confirmPassword">Confirm Password</label>
        <input
          id="confirmPassword"
          name="confirmPassword"
          type="password"
          placeholder="Confirm new password"
          autocomplete="new-password"
          [(ngModel)]="confirmPassword"
          required
          minlength="6"
        />
      </div>

      @if (errorMessage) {
        <p class="error-message" role="alert">
          {{ errorMessage }}
        </p>
      }

      @if (successMessage) {
        <p class="success-message" role="status">
          {{ successMessage }}
        </p>
      }

      <button
        type="submit"
        class="btn btn--primary"
        [disabled]="forgotForm.invalid || loading"
      >
        {{ loading ? 'Updating Password...' : 'Reset Password' }}
      </button>

    </form>

    <p class="auth-card__footer">
      <a routerLink="/login" class="footer-link footer-link--back">
        <span class="back-arrow" aria-hidden="true"></span>
        Back to Login
      </a>
    </p>
  </section>
</main>
