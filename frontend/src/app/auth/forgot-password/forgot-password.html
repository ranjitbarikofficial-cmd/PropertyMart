<!-- src/app/auth/forgot-password/forgot-password.component.html -->
<main class="auth-page">
  <div class="auth-page__backdrop" aria-hidden="true"></div>

  <section class="auth-card" aria-labelledby="forgot-heading">
    <a routerLink="/" class="brand">
      <span class="brand__mark" aria-hidden="true"></span>
      <span class="brand__text">Property<strong>Mart</strong></span>
    </a>

    <div class="icon-badge" aria-hidden="true">
      <span class="icon-badge__envelope">
        <span class="icon-badge__flap"></span>
      </span>
    </div>

    <h1 id="forgot-heading" class="auth-card__title">Forgot your password?</h1>
    <p class="auth-card__subtitle">
      No worries. Enter the email linked to your account and we'll send you instructions to reset
      your password.
    </p>

    <form class="auth-form" novalidate>
      <div class="field">
        <label for="email">Email address</label>
        <input
          id="email"
          name="email"
          type="email"
          placeholder="you@example.com"
          autocomplete="email"
          required
        />
      </div>

      <button type="submit" class="btn btn--primary">Send Reset Link</button>
    </form>

    <p class="auth-card__footer">
      <a routerLink="/login" class="footer-link footer-link--back">
        <span class="back-arrow" aria-hidden="true"></span>
        Back to Login
      </a>
    </p>
  </section>
</main>
